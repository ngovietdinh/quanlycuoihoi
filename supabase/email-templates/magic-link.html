<!-- Liên kết đăng nhập — dán vào Supabase → Authentication → Emails → Templates -->
<div style="font-family:Arial,Helvetica,sans-serif;max-width:480px;margin:0 auto;padding:28px 24px;background:#ffffff;border:1px solid #eee;border-radius:16px;color:#1c1825">
  <p style="margin:0 0 4px;font-size:20px;font-weight:800">FamilyPlan</p>
  <p style="margin:0 0 20px;font-size:13px;color:#746d83">Cưới hỏi &amp; tổ ấm</p>
  <h2 style="margin:0 0 10px;font-size:20px">Liên kết đăng nhập</h2>
  <p style="margin:0 0 20px;font-size:15px;line-height:1.6">Bấm nút dưới đây để đăng nhập FamilyPlan, không cần mật khẩu.</p>
  <p style="margin:0 0 24px"><a href="{{ .SiteURL }}/auth/callback?token_hash={{ .TokenHash }}&type=email&next=/dashboard" style="display:inline-block;padding:12px 22px;border-radius:12px;background:#ff3d78;color:#ffffff;text-decoration:none;font-weight:700">Đăng nhập</a></p>
  <p style="margin:0 0 6px;font-size:14px">Hoặc nhập mã này trong ứng dụng:</p>
  <p style="margin:0 0 20px;font-size:30px;font-weight:800;letter-spacing:8px">{{ .Token }}</p>
  <p style="margin:0;font-size:12px;color:#9a93a8;line-height:1.6">Liên kết và mã chỉ dùng được một lần, hết hạn sau 1 giờ. Nếu bạn không yêu cầu, hãy bỏ qua email này.</p>
</div>
